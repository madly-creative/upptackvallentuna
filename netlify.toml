[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Mail to Loopia info@upptackvallentuna.se — set in Netlify → Site settings → Environment variables:
#   CONTACT_EMAIL=info@upptackvallentuna.se
#   SMTP_USER=info@upptackvallentuna.se
#   SMTP_PASS=<Loopia-lösenord för info@>
#   SMTP_HOST=smtp.loopia.se   (default)
#   SMTP_PORT=587              (default)
# Without SMTP_PASS the function falls back to FormSubmit → same inbox (activate once via email).

# Service worker must revalidate so clients pick up new shell caches
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
