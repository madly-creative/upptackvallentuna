[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Mail to Loopia info@upptackvallentuna.se — set in Netlify → Environment variables:
#   CONTACT_EMAIL=info@upptackvallentuna.se
#   SMTP_USER=info@upptackvallentuna.se
#   SMTP_PASS=<Loopia-lösenord för info@>
#   SMTP_HOST=mailcluster.loopia.se   (default — not smtp.loopia.se)
#   SMTP_PORT=465                     (default SSL; 587 also tried as fallback)
# Without SMTP_PASS (or if SMTP times out) → FormSubmit to same inbox.

[[redirects]]
  from = "/evenemang/skordefest-i-lindholmen-2026-09-06.html"
  to = "/evenemang/hostfest-skordefest-i-lindholmen-2026-09-06.html"
  status = 301

# Stale 2025 SkördeFEST (wrongly year-bumped) → Hemmaplan Höstmarknad 2026
[[redirects]]
  from = "/evenemang/skordefest-aw-musik-2026-09-12.html"
  to = "/evenemang/vallentuna-hostmarknad-2026-09-19.html"
  status = 301
[[redirects]]
  from = "/evenemang/skordefest-familjefest-2026-09-13.html"
  to = "/evenemang/vallentuna-hostmarknad-2026-09-19.html"
  status = 301
[[redirects]]
  from = "/evenemang/julmarknad-i-centrum-2026-12-13.html"
  to = "/evenemang/vallentuna-julmarknad-2026-12-12.html"
  status = 301

# Closed business — keep old URLs from 404ing
[[redirects]]
  from = "/plats/rookie-cafe-och-restaurang.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/plats/rookie-cafe-och-restaurang"
  to = "/"
  status = 301
[[redirects]]
  from = "/assets/upplev/rookie-cafe-och-restaurang/*"
  to = "/assets/og.jpg"
  status = 301

# Service worker must revalidate so clients pick up new shell caches
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
